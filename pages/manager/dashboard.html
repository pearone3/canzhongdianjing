<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店长总览 · 喰种电竞</title>
  <link rel="stylesheet" href="../../assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../../assets/supabase-client.js"></script>
  <script src="../../assets/chart-init.js"></script>
</head>
<body>
<script>
  (function () {
    const user = App.Auth.getCurrentUser();
    if (!user || user.role !== 'manager') {
      window.location.href = '../../login.html';
      return;
    }
    // 自定义导航栏
    const base = App.getBasePath();
    const navHtml = `
      <nav class="navbar">
        <a href="../../pages/manager/dashboard.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
          <div class="logo-dot"></div>
          <span style="font-size:16px;font-weight:700;letter-spacing:1px;">喰种电竞</span>
          <span style="font-size:12px;color:var(--text-muted);">报单系统</span>
        </a>
        <div class="navbar-nav">
          <a href="../../pages/manager/dashboard.html" class="active">总览</a>
          <a href="../../pages/manager/reports.html">报单管理</a>
          <a href="../../pages/manager/announcements.html">公告管理</a>
          <a href="../../pages/manager/players.html">打手管理</a>
          <a href="../../pages/manager/settings.html">系统设置</a>
          <a href="../../pages/public/index.html">公共看板</a>
        </div>
        <div class="navbar-right">
          <div class="user-badge">
            <div class="avatar">${(user.username || '?').charAt(0).toUpperCase()}</div>
            <span>${App.Utils.escapeHtml(user.username)}</span>
            <span class="role-tag">管理员</span>
          </div>
          <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
        </div>
      </nav>
    `;
    document.body.insertAdjacentHTML('afterbegin', navHtml);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      App.Auth.logout();
    });

    const container = document.createElement('div');
    container.className = 'page-container';
    container.innerHTML = `
      <div class="page-header">
        <h1>📊 店长总览</h1>
        <p>全店数据监控 · 近30天趋势 · 打手排行</p>
      </div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-label">近30天总单量</div><div class="stat-value" id="totalOrders">-</div></div>
        <div class="stat-card"><div class="stat-label">总收益</div><div class="stat-value" id="totalIncome">-</div></div>
        <div class="stat-card"><div class="stat-label">活跃打手</div><div class="stat-value" id="activePlayers">-</div></div>
        <div class="stat-card"><div class="stat-label">待审核</div><div class="stat-value" id="pendingReports">-</div></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h3>📈 接单趋势</h3></div>
          <div class="card-body"><div class="chart-container"><canvas id="trendChart"></canvas></div></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>🏆 打手排行榜</h3></div>
          <div class="card-body"><ul class="rank-list" id="rankList"></ul></div>
        </div>
      </div>
      <div class="card section-gap">
        <div class="card-header"><h3>📋 最新报单</h3></div>
        <div class="card-body"><div id="recentReports"></div></div>
      </div>
    `;
    document.body.appendChild(container);

    async function loadData() {
      try {
        const reports = await App.DB.getApprovedReportsLastDays(30);
        const allReports = await App.DB.getAllReports();
        const players = await App.DB.getAllPlayers();
        const pending = allReports.filter(r => r.status === 'pending');

        document.getElementById('totalOrders').textContent = reports.length;
        document.getElementById('totalIncome').textContent = '¥' + App.Utils.formatNumber(reports.reduce((s, r) => s + (parseFloat(r.price) || 0), 0));
        document.getElementById('activePlayers').textContent = new Set(reports.map(r => r.player_id)).size;
        document.getElementById('pendingReports').textContent = pending.length;

        const { labels, counts } = App.Utils.aggregateByDate(reports, 30);
        ChartHelper.renderLine('trendChart', labels, counts, { label: '接单数' });

        const rankList = document.getElementById('rankList');
        const playerMap = {};
        players.forEach(p => { playerMap[p.id] = p.username; });
        const orderCount = {};
        reports.forEach(r => { orderCount[r.player_id] = (orderCount[r.player_id] || 0) + 1; });
        const sorted = Object.entries(orderCount).sort((a, b) => b[1] - a[1]);
        if (sorted.length === 0) {
          rankList.innerHTML = '<li class="empty-state">暂无数据</li>';
        } else {
          rankList.innerHTML = sorted.slice(0, 10).map(([id, count], idx) => `
            <li class="rank-item">
              <span class="rank-num">${idx + 1}</span>
              <span class="rank-name">${App.Utils.escapeHtml(playerMap[id] || '未知')}</span>
              <span class="rank-value">${count} 单</span>
            </li>
          `).join('');
        }

        const recent = allReports.slice(0, 10);
        const recentDiv = document.getElementById('recentReports');
        if (recent.length === 0) {
          recentDiv.innerHTML = '<div class="empty-state">暂无报单</div>';
        } else {
          recentDiv.innerHTML = recent.map(r => `
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">
              <div>
                <strong>${App.Utils.escapeHtml(r.customer_name || '未填')}</strong>
                <span style="color:var(--text-muted);font-size:12px;margin-left:12px;">${r.time_range || ''}</span>
                <span style="color:var(--text-muted);font-size:12px;margin-left:12px;">${r.players?.username || '未知'}</span>
              </div>
              <div>
                <span class="badge ${App.Utils.statusBadgeClass(r.status)}">${App.Utils.statusText(r.status)}</span>
                <span style="margin-left:12px;">${r.price ? '¥'+r.price : ''}</span>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error(err);
        App.Utils.showToast('加载失败', 'error');
      }
    }
    loadData();
  })();
</script>
</body>
</html>
